name: wax-lp-impermanent-loss-heat-map
trust_label: educational-reference
version: 0.1.0
purpose: >
  Compute full-range IL in bps and test a symmetric range. Do not call it a v3 position.
invariants:
  - src/il.ts performs no network or wallet calls.
  - Requests in src/usecases.ts set executed to false.
  - No use case contains a transaction.
do_not:
  - Do not add a live Alcor client and keep this trust label.
  - Do not describe a fixture as a mainnet response.
entrypoints:
  logic: src/il.ts
  tests: src/il.test.ts
  demo: src/Demo.tsx
  queries: src/usecases.ts
commands:
  test: npm test
  demo: npm run dev
live_data:
  status: untested
  notes: No endpoint was called.
